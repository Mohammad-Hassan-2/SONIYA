<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Письмо для Сонечки 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400;1,600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fdf6ee;
    --rose: #d4748a;
    --deep-rose: #a84f65;
    --envelope-body: #f7e8d0;
    --paper: #fffdf8;
    --ink: #3a2535;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at 30% 20%, #fce4ec 0%, #f8d7e8 20%, #ede0f5 45%, #dce8f8 70%, #e8f0e8 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    overflow: hidden;
    position: relative;
  }

  /* ── FLOATING PETALS ── */
  .petal {
    position: fixed;
    pointer-events: none;
    animation: floatPetal linear infinite;
    opacity: 0.5;
  }
  @keyframes floatPetal {
    0%   { transform: translateY(-20px) rotate(0deg);    opacity: 0; }
    10%  { opacity: 0.6; }
    90%  { opacity: 0.4; }
    100% { transform: translateY(110vh) rotate(360deg);  opacity: 0; }
  }

  /* ── HINT ── */
  .hint {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
    color: var(--deep-rose);
    letter-spacing: 0.15em;
    margin-bottom: 2.5rem;
    animation: pulseHint 2s ease-in-out infinite;
    font-style: italic;
    text-shadow: 0 1px 8px rgba(168,79,101,0.18);
    transition: opacity 0.5s;
  }
  .hint.hidden { opacity: 0; pointer-events: none; }
  @keyframes pulseHint {
    0%,100% { opacity: 0.7; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.04); }
  }

  /* ── SCENE / ENVELOPE ── */
  .scene {
    perspective: 1200px;
    width: 340px;
    height: 240px;
    position: relative;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.3s ease;
  }

  .env-body {
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, var(--envelope-body) 60%, #efd4b0 100%);
    border-radius: 8px 8px 16px 16px;
    box-shadow: 0 20px 60px rgba(100,50,60,0.18), 0 4px 12px rgba(200,120,100,0.12);
    overflow: hidden;
    transition: box-shadow 0.3s;
  }
  .env-body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(45deg, transparent, transparent 18px, rgba(210,180,140,0.07) 18px, rgba(210,180,140,0.07) 36px);
  }
  .env-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 130px; overflow: hidden; }
  .env-bottom::after {
    content: '';
    position: absolute;
    bottom: 0; left: -10px; right: -10px;
    height: 160px;
    background: linear-gradient(170deg, #f0d9b8 40%, #e8c89a 100%);
    clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
  }
  .env-side-left  { position:absolute; bottom:0; left:0;  width:0; height:0; border-width:130px 0 0 170px; border-style:solid; border-color:transparent transparent transparent #ebd3b0; }
  .env-side-right { position:absolute; bottom:0; right:0; width:0; height:0; border-width:130px 170px 0 0;  border-style:solid; border-color:transparent #ebd3b0 transparent transparent; }

  .seal {
    position: absolute;
    bottom: 18px; left: 50%;
    transform: translateX(-50%);
    width: 44px; height: 44px;
    background: radial-gradient(circle, #d4748a, #a84f65);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem;
    box-shadow: 0 2px 10px rgba(168,79,101,0.4);
    z-index: 5;
    transition: transform 0.4s, opacity 0.4s, box-shadow 0.3s;
  }
  .scene:hover .seal { transform: translateX(-50%) scale(1.1); box-shadow: 0 4px 18px rgba(168,79,101,0.55); }
  .scene.opened .seal { opacity: 0; transform: translateX(-50%) scale(0.3); }

  .env-flap {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 145px;
    transform-origin: top center;
    transform-style: preserve-3d;
    z-index: 10;
    transition: transform 0.9s cubic-bezier(0.4,0,0.2,1);
  }
  .env-flap-inner { position:absolute; inset:0; overflow:hidden; }
  .env-flap-inner::before {
    content:'';
    position:absolute;
    top:-10px; left:-10px; right:-10px;
    height:180px;
    background: linear-gradient(175deg,#f5e4c8 30%,#ecd4aa 100%);
    clip-path: polygon(0% 0%, 100% 0%, 50% 82%);
    border-radius: 8px 8px 0 0;
  }
  .env-flap-back { position:absolute; inset:0; overflow:hidden; transform:rotateX(180deg); }
  .env-flap-back::before {
    content:'';
    position:absolute;
    top:-10px; left:-10px; right:-10px;
    height:180px;
    background: linear-gradient(175deg,#ead0b0 30%,#dfc09a 100%);
    clip-path: polygon(0% 0%, 100% 0%, 50% 82%);
  }
  .scene.opened .env-flap { transform: rotateX(-175deg); }
  .scene:hover:not(.opened) .env-body { box-shadow: 0 25px 70px rgba(168,79,101,0.22), 0 4px 16px rgba(200,120,100,0.15); }

  /* ══════════════════════════════════════════
     LETTER OVERLAY — fixed, perfectly centered
  ══════════════════════════════════════════ */
  .letter-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.45s ease;
  }
  .letter-overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .letter-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(50, 15, 35, 0.4);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    cursor: pointer;
  }

  .letter {
    position: relative;
    z-index: 2;
    background: var(--paper);
    border-radius: 6px;
    box-shadow: 0 40px 100px rgba(80,30,50,0.38), 0 8px 30px rgba(200,150,100,0.18);
    padding: 40px 38px 46px;
    width: min(380px, 90vw);
    /* start smaller & lower, then spring into place */
    transform: scale(0.55) translateY(80px);
    transition: transform 0.75s cubic-bezier(0.34,1.56,0.64,1) 0.0s,
                opacity   0.45s ease 0.0s;
    opacity: 0;
    overflow: hidden;
  }
  .letter-overlay.visible .letter {
    transform: scale(1) translateY(0);
    opacity: 1;
  }

  /* paper ruled lines */
  .letter::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(180deg, transparent, transparent 31px, rgba(180,160,140,0.1) 31px, rgba(180,160,140,0.1) 32px);
    pointer-events: none;
  }
  /* gold inner border */
  .letter::after {
    content: '';
    position: absolute;
    inset: 11px;
    border: 1px solid rgba(200,169,110,0.32);
    border-radius: 3px;
    pointer-events: none;
    z-index: 3;
  }

  /* ── HYDRANGEA CORNERS ── */
  .hydrangea-tl, .hydrangea-tr, .hydrangea-bl, .hydrangea-br {
    position: absolute;
    width: 145px; height: 145px;
    pointer-events: none;
    z-index: 1;
  }
  .hydrangea-tl { top: 0;    left: 0;  }
  .hydrangea-tr { top: 0;    right: 0; transform: scaleX(-1); }
  .hydrangea-bl { bottom: 0; left: 0;  transform: scaleY(-1); }
  .hydrangea-br { bottom: 0; right: 0; transform: scale(-1,-1); }

  /* ── LETTER TEXT ── */
  .letter-content {
    position: relative;
    z-index: 4;
    text-align: center;
    padding: 34px 10px 22px;
  }
  .letter-dear {
    font-family: 'Great Vibes', cursive;
    font-size: 2.5rem;
    color: var(--deep-rose);
    display: block;
    margin-bottom: 20px;
    opacity: 0; transform: translateY(12px);
    transition: opacity 0.65s ease 0.6s, transform 0.65s ease 0.6s;
  }
  .letter-text {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 1.48rem;
    line-height: 2.05;
    color: var(--ink);
    letter-spacing: 0.025em;
    opacity: 0; transform: translateY(12px);
    transition: opacity 0.65s ease 0.85s, transform 0.65s ease 0.85s;
  }
  .letter-emoji {
    font-size: 1.85rem;
    display: block;
    margin-top: 12px;
    opacity: 0; transform: scale(0.3) rotate(-25deg);
    transition: opacity 0.5s ease 1.2s, transform 0.65s cubic-bezier(0.34,1.56,0.64,1) 1.2s;
  }
  .letter-sign {
    font-family: 'Great Vibes', cursive;
    font-size: 1.65rem;
    color: var(--rose);
    display: block;
    margin-top: 18px;
    opacity: 0; transform: translateY(10px);
    transition: opacity 0.65s ease 1.05s, transform 0.65s ease 1.05s;
  }
  .letter-overlay.visible .letter-dear,
  .letter-overlay.visible .letter-text,
  .letter-overlay.visible .letter-emoji,
  .letter-overlay.visible .letter-sign {
    opacity: 1;
    transform: none;
  }

  /* close button */
  .close-btn {
    position: absolute;
    top: 13px; right: 13px;
    z-index: 10;
    background: rgba(168,79,101,0.1);
    border: 1px solid rgba(168,79,101,0.28);
    color: var(--deep-rose);
    border-radius: 50%;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
    line-height: 1;
  }
  .close-btn:hover { background: rgba(168,79,101,0.2); transform: scale(1.12); }

  /* ── SPARKLES & HEARTS ── */
  .sparkle {
    position: fixed;
    pointer-events: none;
    font-size: 1.1rem;
    animation: sparkleFloat 1.4s ease-out forwards;
    z-index: 999;
  }
  @keyframes sparkleFloat {
    0%   { transform: translate(0,0) scale(0) rotate(0deg);                                  opacity: 1; }
    50%  { transform: translate(var(--dx), var(--dy)) scale(1.2) rotate(180deg);             opacity: 0.9; }
    100% { transform: translate(calc(var(--dx)*1.8), calc(var(--dy)*2)) scale(0) rotate(360deg); opacity: 0; }
  }
  .heart-float {
    position: fixed;
    font-size: 1.5rem;
    pointer-events: none;
    animation: heartRise 2.6s ease-out forwards;
    z-index: 998;
  }
  @keyframes heartRise {
    0%   { opacity: 0; transform: translateY(0) scale(0.5); }
    15%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-240px) scale(1.1) rotate(12deg); }
  }
</style>
</head>
<body>

<div id="petals"></div>

  <div class="env-flap">

</div>

<script>
  // ── PETALS ──
  const pc = document.getElementById('petals');
  const cols = ['#f7c4ce','#e8b4d0','#d4c4e8','#b8d4f0','#c8e0c8','#f0d4c0'];
  for(let i=0;i<20;i++){
    const p=document.createElement('div'); p.className='petal';
    const c=cols[Math.floor(Math.random()*cols.length)], s=8+Math.random()*14;
    p.style.cssText=`left:${Math.random()*100}vw;top:-20px;width:${s}px;height:${s*.65}px;background:${c};border-radius:60% 40% 60% 40%;animation-duration:${7+Math.random()*10}s;animation-delay:${Math.random()*8}s;`;
    pc.appendChild(p);
  }

  // ── STATE ──
  const scene   = document.getElementById('scene');
  const hint    = document.getElementById('hint');
  const overlay = document.getElementById('letterOverlay');
  const closeBtn = document.getElementById('closeBtn');
  const backdrop = document.getElementById('backdrop');
  let opened = false;

  function spawnSparkles(x,y){
    const em=['✨','💖','🌸','💫','🌺','💕','⭐','🦋'];
    for(let i=0;i<12;i++){
      const s=document.createElement('div'); s.className='sparkle';
      s.textContent=em[Math.floor(Math.random()*em.length)];
      s.style.left=x+'px'; s.style.top=y+'px';
      const a=Math.random()*Math.PI*2, d=50+Math.random()*90;
      s.style.setProperty('--dx',Math.cos(a)*d+'px');
      s.style.setProperty('--dy',Math.sin(a)*d+'px');
      s.style.animationDelay=Math.random()*.3+'s';
      document.body.appendChild(s);
      setTimeout(()=>s.remove(),1600);
    }
  }

  function spawnHearts(){
    const hh=['💖','💗','💝','💞','❤️','🩷'];
    for(let i=0;i<7;i++){
      const h=document.createElement('div'); h.className='heart-float';
      h.textContent=hh[Math.floor(Math.random()*hh.length)];
      h.style.left=(20+Math.random()*60)+'vw';
      h.style.top =(40+Math.random()*30)+'vh';
      h.style.animationDelay=i*.22+'s';
      document.body.appendChild(h);
      setTimeout(()=>h.remove(),2800);
    }
  }

  function openCard(ex,ey){
    if(opened)return;
    opened=true;
    hint.classList.add('hidden');
    spawnSparkles(ex,ey);
    scene.classList.add('opened');
    setTimeout(()=>{ overlay.classList.add('visible'); spawnHearts(); }, 600);
  }

  function closeCard(){
    overlay.classList.remove('visible');
  }

  scene.addEventListener('click',function(e){
    const r=scene.getBoundingClientRect();
    openCard(r.left+r.width/2, r.top+r.height/2);
  });
  scene.addEventListener('touchstart',function(e){
    e.preventDefault();
    const t=e.touches[0];
    openCard(t.clientX, t.clientY);
  },{passive:false});

  closeBtn.addEventListener('click', closeCard);
  backdrop.addEventListener('click', closeCard);

  scene.addEventListener('mousemove',function(e){
    if(opened)return;
    const r=scene.getBoundingClientRect();
    const rx=(e.clientX-r.left-r.width/2)/r.width*12;
    const ry=(e.clientY-r.top-r.height/2)/r.height*9;
    scene.style.transform=`rotateY(${rx}deg) rotateX(${-ry}deg)`;
  });
  scene.addEventListener('mouseleave',function(){
    if(opened)return;
    scene.style.transform='';
  });
</script>
